name: Build Windows Installer

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Electron and electron-builder binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Verify Electron scripts, types, and unit tests
        shell: bash
        run: |
          for f in electron/*.js electron/*.cjs; do
            node --check "$f"
          done
          npm run lint
          npx tsx --test electron/*.test.ts src/services/*.test.ts src/utils/*.test.ts

      - name: Read app version from package.json
        id: pkg
        shell: bash
        run: |
          VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Cache static Windows FFmpeg binary
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: resources/ffmpeg.exe
          key: ${{ runner.os }}-ffmpeg-essentials-v1

      - name: Download static FFmpeg for offline Windows bundle
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path resources | Out-Null
          $zipPath = Join-Path $env:RUNNER_TEMP "ffmpeg-essentials.zip"
          $extractDir = Join-Path $env:RUNNER_TEMP "ffmpeg-extract"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $zipPath -UseBasicParsing
          Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force
          $ffmpegExe = Get-ChildItem -Path $extractDir -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
          if (-not $ffmpegExe) {
            throw "ffmpeg.exe not found inside downloaded archive"
          }
          Copy-Item -Path $ffmpegExe.FullName -Destination "resources/ffmpeg.exe" -Force
          & "resources/ffmpeg.exe" -version | Select-Object -First 1

      - name: Build React frontend for Electron
        run: npm run build:renderer

      - name: Build Windows NSIS installer (.exe)
        run: npx electron-builder --win --x64 --publish never

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: KinoFlowStudio-Windows-Installer-v${{ steps.pkg.outputs.version }}
          path: dist/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release for in-app updater
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: KinoFlow Studio v${{ steps.pkg.outputs.version }}
          files: dist/*.exe
          make_latest: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
